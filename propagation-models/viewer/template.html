<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
{{FONTS}}
<style>
/* Layout: one-screen viewer — scaled 1920×1080 stage, notes panel beside it on wide screens, control bar below */
:root {
  --bg: #E7E4DC; --surface: #F6F4EE; --fg: #14213D; --muted: #5A6272;
  --accent: #A84A16; --line: #CFCAC0; --stage: #D9D5CB;
  --ui: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
  --mono: 'JetBrains Mono', 'Courier New', monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1626; --surface: #17223A; --fg: #E8ECF3; --muted: #9DA8BB;
  --accent: #F0A36B; --line: #2C3955; --stage: #0A101C; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1626; --surface: #17223A; --fg: #E8ECF3; --muted: #9DA8BB;
  --accent: #F0A36B; --line: #2C3955; --stage: #0A101C; color-scheme: dark }
[hidden] { display: none !important }
html, body { height: 100%; margin: 0 }
body {
  background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 14px;
  display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box;
}
.main { flex: 1; min-height: 0; display: flex; gap: 12px }
.stage { flex: 1; min-width: 0; position: relative; background: var(--stage); border-radius: 10px; overflow: hidden; cursor: pointer; touch-action: pan-y }
.frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0 }
.notes { width: 360px; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px }
.notes h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600 }
.notes p { margin: 0; font-size: 16px; line-height: 1.7 }
.bar { display: flex; flex-direction: column; gap: 8px; padding-top: 10px }
.progress { display: flex; gap: 3px; height: 6px }
.progress button { flex: 1; border: 0; padding: 0; border-radius: 3px; background: var(--line); cursor: pointer }
.progress button.done { background: var(--muted) }
.progress button.on { background: var(--accent) }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.btn { font: 500 14px/1 var(--ui); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; white-space: nowrap }
.btn:hover { border-color: var(--muted) }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.btn:disabled { opacity: .4; cursor: default }
button:focus-visible, select:focus-visible, .thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.count { font: 500 14px var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); min-width: 64px; text-align: center }
select { font: 14px var(--ui); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; flex: 1 1 220px; max-width: 420px }
.spacer { flex: 1 }
.hint { color: var(--muted); font-size: 12px }
.grid { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow-y: auto;
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.grid-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px }
.grid-head h2 { margin: 0; font-size: 18px; font-weight: 600 }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px }
.thumb { display: flex; flex-direction: column; gap: 6px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--fg); font: 13px var(--ui) }
.thumb .pic { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; border: 2px solid transparent; background: var(--stage) }
.thumb.on .pic { border-color: var(--accent) }
.thumb .pic > section { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none }
.thumb span { color: var(--muted) }
.thumb b { font-family: var(--mono); color: var(--fg); margin-right: 6px }
:fullscreen body, body.fs { padding: 0 }
body.fs .stage { border-radius: 0; background: #000 }
body.fs .notes { display: none }
body.fs .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); transition: opacity .25s }
body.fs.idle .bar { opacity: 0; pointer-events: none }
body.fs.idle .stage { cursor: none }
@media (max-width: 900px) {
  .main { flex-direction: column }
  .notes { width: auto; max-height: 34vh }
  .hint { display: none }
}

/* Slide subset — canvas defaults for the deck's inline-styled sections */
.slide { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; box-sizing: border-box; overflow: hidden; font-size: 32px; line-height: 1.4 }
.slide * { box-sizing: border-box; margin: 0 }
.slide h1 { font-size: 96px; font-weight: 600; line-height: 1.1 }
.slide h2 { font-size: 64px; font-weight: 600; line-height: 1.15 }
.slide h3 { font-size: 44px; font-weight: 600; line-height: 1.2 }
.slide p { line-height: 1.4 }
.slide ul, .slide ol { padding-left: 1.3em }
.slide table { width: 100%; border-collapse: collapse; font: inherit }
.slide th, .slide td { padding: .35em .6em; border-bottom: 1px solid rgba(20, 33, 61, .18); text-align: left; vertical-align: top; font-weight: 400 }
.slide th { font-weight: 600 }
.slide svg { display: block }
.slide x-shape { display: block; flex: none }
.slide x-shape[kind="arrow-right"] { clip-path: polygon(0 30%, 60% 30%, 60% 0, 100% 50%, 60% 100%, 60% 70%, 0 70%) }
.slide x-shape[kind="arrow-left"] { clip-path: polygon(100% 30%, 40% 30%, 40% 0, 0 50%, 40% 100%, 40% 70%, 100% 70%) }
.slide x-shape[kind="ellipse"] { border-radius: 50% }
.slide aside { display: none }
.frame > .slide { visibility: hidden; opacity: 0; transition: opacity .25s ease }
.frame > .slide.on { visibility: visible; opacity: 1 }
@media (prefers-reduced-motion: reduce) { .frame > .slide { transition: none } }
</style>

<div class="main">
  <div class="stage" id="stage" role="region" aria-roledescription="슬라이드" aria-live="polite">
    <div class="frame" id="frame">
{{SLIDES}}
    </div>
  </div>
  <aside class="notes" id="notes" aria-label="발표자 노트" hidden>
    <h2 id="notesTitle">발표자 노트</h2>
    <p id="notesText"></p>
  </aside>
</div>

<div class="bar" id="bar">
  <div class="progress" id="progress" aria-label="슬라이드 진행"></div>
  <div class="controls">
    <button class="btn" id="prev" type="button" aria-label="이전 슬라이드">← 이전</button>
    <span class="count" id="count">1 / 1</span>
    <button class="btn" id="next" type="button" aria-label="다음 슬라이드">다음 →</button>
    <select id="jump" aria-label="슬라이드로 이동"></select>
    <span class="spacer"></span>
    <span class="hint">← → 이동 · G 개요 · N 노트 · F 전체화면</span>
    <button class="btn" id="gridBtn" type="button" aria-pressed="false">개요</button>
    <button class="btn" id="notesBtn" type="button" aria-pressed="false">노트</button>
    <button class="btn" id="fsBtn" type="button">전체화면</button>
  </div>
</div>

<div class="grid" id="grid" hidden>
  <div class="grid-head">
    <h2>전체 슬라이드</h2>
    <button class="btn" id="gridClose" type="button">닫기 (Esc)</button>
  </div>
  <div class="thumbs" id="thumbs"></div>
</div>

<script>
(function () {
  var W = 1920, H = 1080;
  var stage = document.getElementById('stage'), frame = document.getElementById('frame');
  var slides = Array.prototype.slice.call(frame.children).filter(function (n) { return n.tagName === 'SECTION'; });
  var n = slides.length, cur = 0;
  var $ = function (id) { return document.getElementById(id); };
  var prevBtn = $('prev'), nextBtn = $('next'), count = $('count'), jump = $('jump'), progress = $('progress');
  var notes = $('notes'), notesText = $('notesText'), notesTitle = $('notesTitle'), notesBtn = $('notesBtn');
  var grid = $('grid'), thumbs = $('thumbs'), gridBtn = $('gridBtn'), fsBtn = $('fsBtn');

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  var info = slides.map(function (s, i) {
    s.classList.add('slide');
    var h = s.querySelector('h1, h2');
    var title = h ? h.textContent.replace(/\s+/g, ' ').trim() : '슬라이드 ' + (i + 1);
    var a = s.querySelector('aside');
    return { title: title, note: a ? a.textContent.trim() : '' };
  });

  info.forEach(function (it, i) {
    var o = document.createElement('option');
    o.value = i; o.textContent = (i + 1) + '. ' + it.title;
    jump.appendChild(o);
    var b = document.createElement('button');
    b.type = 'button'; b.setAttribute('aria-label', (i + 1) + '번 슬라이드: ' + it.title);
    b.addEventListener('click', function () { go(i); });
    progress.appendChild(b);
    var t = document.createElement('button');
    t.type = 'button'; t.className = 'thumb';
    var pic = document.createElement('div'); pic.className = 'pic';
    var clone = slides[i].cloneNode(true); clone.removeAttribute('id');
    pic.appendChild(clone);
    var cap = document.createElement('span');
    cap.innerHTML = '<b>' + String(i + 1).padStart(2, '0') + '</b>';
    cap.appendChild(document.createTextNode(it.title));
    t.appendChild(pic); t.appendChild(cap);
    t.addEventListener('click', function () { go(i); showGrid(false); });
    thumbs.appendChild(t);
  });

  function fit() {
    var r = stage.getBoundingClientRect();
    var s = Math.min(r.width / W, r.height / H);
    frame.style.transform = 'translate(' + (r.width - W * s) / 2 + 'px,' + (r.height - H * s) / 2 + 'px) scale(' + s + ')';
  }
  function fitThumbs() {
    Array.prototype.forEach.call(thumbs.querySelectorAll('.pic'), function (p) {
      p.firstChild.style.transform = 'scale(' + p.clientWidth / W + ')';
    });
  }

  function go(i) {
    i = Math.max(0, Math.min(n - 1, i));
    slides[cur].classList.remove('on');
    cur = i;
    slides[cur].classList.add('on');
    count.textContent = (cur + 1) + ' / ' + n;
    jump.value = cur;
    prevBtn.disabled = cur === 0; nextBtn.disabled = cur === n - 1;
    Array.prototype.forEach.call(progress.children, function (b, k) {
      b.className = k === cur ? 'on' : (k < cur ? 'done' : '');
    });
    Array.prototype.forEach.call(thumbs.children, function (t, k) { t.classList.toggle('on', k === cur); });
    notesTitle.textContent = '발표자 노트 · ' + (cur + 1) + '/' + n;
    notesText.textContent = info[cur].note || '(노트 없음)';
    stage.setAttribute('aria-label', (cur + 1) + ' / ' + n + ': ' + info[cur].title);
    try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
  }

  function showNotes(on) {
    notes.hidden = !on; notesBtn.setAttribute('aria-pressed', String(on));
    store('deck-notes', on ? '1' : '0'); fit();
  }
  function showGrid(on) {
    grid.hidden = !on; gridBtn.setAttribute('aria-pressed', String(on));
    if (on) { fitThumbs(); var t = thumbs.children[cur]; if (t) { t.focus(); t.scrollIntoView({ block: 'nearest' }); } }
  }
  function toggleFs() {
    var d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) {
      (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    } else {
      var el = d.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) { try { var p = req.call(el); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
    }
  }
  function onFs() {
    var on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    document.body.classList.toggle('fs', on);
    fsBtn.textContent = on ? '전체화면 종료' : '전체화면';
    poke(); setTimeout(fit, 50);
  }
  var idleTimer;
  function poke() {
    document.body.classList.remove('idle'); clearTimeout(idleTimer);
    if (document.body.classList.contains('fs')) idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 2200);
  }

  prevBtn.addEventListener('click', function () { go(cur - 1); });
  nextBtn.addEventListener('click', function () { go(cur + 1); });
  jump.addEventListener('change', function () { go(+jump.value); jump.blur(); });
  notesBtn.addEventListener('click', function () { showNotes(notes.hidden); });
  gridBtn.addEventListener('click', function () { showGrid(grid.hidden); });
  $('gridClose').addEventListener('click', function () { showGrid(false); });
  fsBtn.addEventListener('click', toggleFs);
  document.addEventListener('fullscreenchange', onFs);
  document.addEventListener('webkitfullscreenchange', onFs);
  document.addEventListener('mousemove', poke);

  stage.addEventListener('click', function (e) {
    var r = stage.getBoundingClientRect();
    if (e.clientX - r.left < r.width * 0.3) go(cur - 1); else go(cur + 1);
  });
  var tx = null, ty = null;
  stage.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); go(cur + (dx < 0 ? 1 : -1)); }
    tx = null;
  });

  var typed = '';
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target === jump) return;
    var k = e.key;
    if (!grid.hidden) {
      if (k === 'Escape' || k === 'g' || k === 'G') { showGrid(false); e.preventDefault(); }
      return;
    }
    if (/^[0-9]$/.test(k)) { typed += k; return; }
    if (k === 'Enter' && typed) { go(+typed - 1); typed = ''; e.preventDefault(); return; }
    typed = '';
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || (k === ' ' && !e.shiftKey)) { go(cur + 1); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || (k === ' ' && e.shiftKey) || k === 'Backspace') { go(cur - 1); }
    else if (k === 'Home') { go(0); }
    else if (k === 'End') { go(n - 1); }
    else if (k === 'n' || k === 'N') { showNotes(notes.hidden); }
    else if (k === 'g' || k === 'G') { showGrid(true); }
    else if (k === 'f' || k === 'F') { toggleFs(); }
    else return;
    e.preventDefault();
  });

  window.addEventListener('resize', function () { fit(); if (!grid.hidden) fitThumbs(); });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);

  var start = parseInt((location.hash || '').slice(1), 10);
  slides[0].classList.add('on');
  go(isNaN(start) ? 0 : start - 1);
  showNotes(store('deck-notes') === '1');
  fit();
})();
</script>
